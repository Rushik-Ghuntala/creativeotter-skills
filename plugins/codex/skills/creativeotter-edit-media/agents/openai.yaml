# CreativeOtter adaptation, 2026-11-01. MCP dependency is added by a connected package build.
interface:
  display_name: "CreativeOtter — Edit Existing Media"
  short_description: "Trim, cut, reframe, caption, and add intros to media"
  default_prompt: "Use $creativeotter-edit-media to edit my existing footage or
    recording (cuts, framing, captions, audio, or an intro/outro) and deliver
    the finished result."
policy:
  allow_implicit_invocation: true
